<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — OSDispatch</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { width: 100%; max-width: 380px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .login-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .login-header .brand-mark { width: 40px; height: 40px; border-radius: 11px; }
  .login-header .brand-mark::after { width: 13px; height: 13px; }
  .login-header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .login-header p { margin: 0; font-size: 13px; color: var(--text-mid); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--subtle); border-radius: 10px; padding: 4px; }
  .tab-btn {
    padding: 9px 0; border: none; border-radius: 8px; background: transparent; color: var(--text-mid);
    font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color .15s ease, color .15s ease;
  }
  .tab-btn.tab-active { background: var(--accent); color: #fff; }

  form.login-form { display: flex; flex-direction: column; gap: 14px; }
  form.login-form.hidden { display: none; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
  #driverPin { letter-spacing: 0.5em; text-align: center; font-size: 18px; }

  .error-banner {
    background: var(--disconnected-bg); border: 1px solid var(--disconnected-border); color: var(--disconnected-text);
    font-size: 13px; border-radius: 10px; padding: 10px 12px;
  }
  .error-banner.hidden { display: none; }
</style>
</head>
<body>

  <div class="login-card card">
    <div class="login-header">
      <div class="brand-mark"></div>
      <h1>OSDispatch</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="tabs">
      <button id="tabDriver" type="button" class="tab-btn">Driver</button>
      <button id="tabDispatcher" type="button" class="tab-btn">Dispatcher</button>
    </div>

    <form id="driverForm" class="login-form">
      <div class="field">
        <label for="driverCode">Driver code</label>
        <input id="driverCode" class="input" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="driverPin">4-digit PIN</label>
        <input id="driverPin" class="input input-mono" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>

    <form id="dispatcherForm" class="login-form hidden">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" class="input" type="text" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>

    <div id="errorBanner" class="error-banner hidden"></div>
  </div>

<script>
(function () {
  const tabDriver = document.getElementById('tabDriver');
  const tabDispatcher = document.getElementById('tabDispatcher');
  const driverForm = document.getElementById('driverForm');
  const dispatcherForm = document.getElementById('dispatcherForm');
  const errorBanner = document.getElementById('errorBanner');

  function setTab(tab) {
    errorBanner.classList.add('hidden');
    const isDriver = tab === 'driver';
    driverForm.classList.toggle('hidden', !isDriver);
    dispatcherForm.classList.toggle('hidden', isDriver);
    tabDriver.classList.toggle('tab-active', isDriver);
    tabDispatcher.classList.toggle('tab-active', !isDriver);
  }

  tabDriver.addEventListener('click', () => setTab('driver'));
  tabDispatcher.addEventListener('click', () => setTab('dispatcher'));
  setTab('driver');

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.remove('hidden');
  }

  async function submitLogin(url, body) {
    errorBanner.classList.add('hidden');
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        showError(errBody.error || 'Sign in failed.');
        return;
      }
      const { role } = await res.json();
      window.location.href = role === 'dispatcher' ? '/dispatch' : '/driver';
    } catch (err) {
      showError('Unable to reach the server. Please try again.');
    }
  }

  driverForm.addEventListener('submit', (e) => {
    e.preventDefault();
    submitLogin('/api/login/driver', {
      code: document.getElementById('driverCode').value.trim(),
      pin: document.getElementById('driverPin').value.trim(),
    });
  });

  dispatcherForm.addEventListener('submit', (e) => {
    e.preventDefault();
    submitLogin('/api/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });
  });
})();
</script>
</body>
</html>
