<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manage Drivers — OSDispatch</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .page-wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }
  .panel { display: flex; }
  .panel-main { flex: 1; min-width: 0; padding: 22px; }
  .panel-side { width: 320px; flex: none; border-left: 1px solid var(--border); background: var(--subtle); padding: 22px; }
  @media (max-width: 900px) { .panel { flex-direction: column; } .panel-side { width: auto; border-left: none; border-top: 1px solid var(--border); } }

  .panel-heading { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .panel-heading h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .panel-heading .text-low { font-weight: 500; }

  .table-header, .table-row {
    display: grid; grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr 0.9fr 1.7fr; gap: 12px; align-items: center;
  }
  .table-header {
    padding: 0 10px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-low);
    letter-spacing: 0.05em; border-bottom: 1px solid var(--border);
  }
  .table-row { padding: 13px 10px; border-bottom: 1px solid var(--subtle); }
  .table-row.is-inactive { background: #fafbfd; opacity: 0.7; }
  .row-driver { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row-driver .name { font-size: 14px; font-weight: 600; }
  .row-driver .code { font-family: var(--font-mono); font-size: 11px; color: var(--text-low); }
  .row-actions { display: flex; gap: 12px; justify-content: flex-end; font-size: 13px; }
  .pin-set { color: var(--active-text); font-family: var(--font-mono); font-size: 13px; }
  .pin-none { color: var(--text-low); font-family: var(--font-mono); font-size: 13px; }
  .last-active { font-family: var(--font-mono); font-size: 12px; color: var(--text-mid); }

  .row-error { grid-column: 1 / -1; font-size: 12px; color: var(--disconnected-text); margin-top: 6px; }
  .row-error.hidden { display: none; }
  .reset-pin-inline { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .reset-pin-inline .input { width: 68px; height: 30px; padding: 0 6px; font-size: 12px; }

  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field label { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); letter-spacing: 0.05em; }
  .pin-row { display: flex; gap: 8px; }
  .pin-row .input-pin { flex: 1; }
  .form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

  #addError.hidden { display: none; }
  #addError { background: var(--disconnected-bg); border: 1px solid var(--disconnected-border); color: var(--disconnected-text); font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><div class="brand-mark"></div><span class="brand-name">OSDispatch</span></div>
  <h1 style="font-size:16px;font-weight:700;margin:0 0 0 12px;">Driver Management</h1>
  <div style="margin-left:auto;display:flex;align-items:center;gap:16px;">
    <a href="/dispatch" class="btn-link">Back to Dashboard</a>
    <button id="logoutBtn" class="btn-link">Log out</button>
  </div>
</header>

<div class="page-wrap">
  <div class="card panel">
    <div class="panel-main">
      <div class="panel-heading">
        <h2>Drivers <span id="driverCount" class="text-low"></span></h2>
        <div style="margin-left:auto;display:flex;gap:8px;font-family:var(--font-mono);font-size:12px;">
          <span id="activeCount" class="badge badge-active"></span>
          <span id="inactiveCount" class="badge badge-ended"></span>
        </div>
      </div>

      <div class="table-header">
        <span>DRIVER</span><span>PHONE</span><span>PIN</span><span>STATE</span><span>LAST ACTIVE</span><span style="text-align:right;">ACTIONS</span>
      </div>
      <div id="driverTable"></div>
      <p id="emptyState" class="empty-state hidden" style="padding:16px 10px;color:var(--text-low);font-size:13px;">No drivers yet — add one on the right.</p>
    </div>

    <div class="panel-side">
      <h3 style="margin:0 0 4px;font-size:18px;font-weight:700;">Add driver</h3>
      <p style="margin:0 0 20px;font-size:13px;color:var(--text-mid);line-height:1.45;">Creates an account and a check-in PIN.</p>
      <form id="addForm">
        <div class="field">
          <label>FULL NAME</label>
          <input id="newDisplayName" type="text" class="input" required />
        </div>
        <div class="field">
          <label>DRIVER CODE</label>
          <input id="newCode" type="text" class="input" required />
        </div>
        <div class="field">
          <label>PHONE (OPTIONAL)</label>
          <input id="newPhone" type="tel" class="input input-mono" />
        </div>
        <div class="field">
          <label>VEHICLE ID (OPTIONAL)</label>
          <input id="newVehicleId" type="text" class="input input-mono" />
        </div>
        <div class="field">
          <label>CHECK-IN PIN</label>
          <div class="pin-row">
            <input id="newPin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" required class="input input-pin" />
            <button type="button" id="generatePin" class="btn btn-primary" title="Generate a random PIN">↻ Generate</button>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-success">Add driver</button>
        </div>
        <div id="addError" class="hidden"></div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  const driverTable = document.getElementById('driverTable');
  const emptyState = document.getElementById('emptyState');
  const addForm = document.getElementById('addForm');
  const addError = document.getElementById('addError');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function initials(name) {
    const parts = String(name).trim().split(/\s+/);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
  }

  function hueForDriver(id) {
    let hash = 0;
    const s = String(id);
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function formatRelative(iso) {
    if (!iso) return 'never';
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return `${min} min ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr} h ago`;
    const days = Math.floor(hr / 24);
    return `${days} day${days === 1 ? '' : 's'} ago`;
  }

  function randomPin() {
    return String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  }

  document.getElementById('generatePin').addEventListener('click', () => {
    document.getElementById('newPin').value = randomPin();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  async function loadDrivers() {
    const res = await fetch('/api/drivers');
    if (res.status === 401 || res.status === 403) {
      window.location.href = '/login';
      return;
    }
    const drivers = await res.json();
    renderDrivers(drivers);
  }

  function renderDrivers(drivers) {
    emptyState.classList.toggle('hidden', drivers.length > 0);
    driverTable.innerHTML = '';
    document.getElementById('driverCount').textContent = drivers.length;
    const activeN = drivers.filter((d) => d.active).length;
    document.getElementById('activeCount').textContent = `${activeN} active`;
    document.getElementById('inactiveCount').textContent = `${drivers.length - activeN} inactive`;

    drivers.forEach((driver) => {
      const row = document.createElement('div');
      row.className = 'table-row' + (driver.active ? '' : ' is-inactive');
      const hue = hueForDriver(driver.id);
      row.innerHTML = `
        <div class="row-driver">
          <div class="avatar avatar-sm" style="background:hsl(${hue},70%,50%)">${initials(driver.displayName)}</div>
          <div>
            <div class="name">${escapeHtml(driver.displayName)}</div>
            <div class="code">${escapeHtml(driver.code)}${driver.vehicleId ? ' · ' + escapeHtml(driver.vehicleId) : ''}</div>
          </div>
        </div>
        <span class="mono" style="font-size:13px;color:var(--text-mid);">${driver.phone ? escapeHtml(driver.phone) : '—'}</span>
        <span class="${driver.hasPin ? 'pin-set' : 'pin-none'}">${driver.hasPin ? '•••• set' : '— none'}</span>
        <span class="badge ${driver.active ? 'badge-active' : 'badge-ended'}">${driver.active ? 'Active' : 'Inactive'}</span>
        <span class="last-active">${formatRelative(driver.lastActive)}</span>
        <div class="reset-pin-inline">
          <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN" class="input pin-input" />
          <button class="btn-link reset-pin-btn">Reset PIN</button>
          <button class="btn-link toggle-active-btn" style="color:${driver.active ? 'var(--disconnected-text)' : 'var(--active-text)'};">
            ${driver.active ? 'Deactivate' : 'Reactivate'}
          </button>
          <button class="btn-link delete-btn" style="color:var(--disconnected-text);">Delete</button>
        </div>
        <div class="row-error hidden"></div>
      `;

      const rowError = row.querySelector('.row-error');
      function showRowError(message) {
        rowError.textContent = message;
        rowError.classList.remove('hidden');
      }

      row.querySelector('.reset-pin-btn').addEventListener('click', async () => {
        const pinInput = row.querySelector('.pin-input');
        const pin = pinInput.value.trim();
        if (!/^\d{4}$/.test(pin)) {
          showRowError('Enter a 4-digit PIN to reset.');
          return;
        }
        const res = await fetch(`/api/drivers/${driver.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showRowError(body.error || 'Failed to reset PIN.');
          return;
        }
        pinInput.value = '';
        rowError.classList.add('hidden');
        loadDrivers();
      });

      row.querySelector('.toggle-active-btn').addEventListener('click', async () => {
        const res = await fetch(`/api/drivers/${driver.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active: !driver.active }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showRowError(body.error || 'Failed to update driver.');
          return;
        }
        loadDrivers();
      });

      row.querySelector('.delete-btn').addEventListener('click', async () => {
        if (!confirm(`Permanently delete ${driver.displayName} (${driver.code})? This cannot be undone.`)) {
          return;
        }

        let res = await fetch(`/api/drivers/${driver.id}`, { method: 'DELETE' });

        if (res.status === 409) {
          const body = await res.json().catch(() => ({}));
          if (body.hasHistory && confirm(
            `${driver.displayName} has recorded location history. Delete the driver AND permanently erase that history?`
          )) {
            res = await fetch(`/api/drivers/${driver.id}`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ purgeHistory: true }),
            });
          } else {
            return;
          }
        }

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showRowError(body.error || 'Failed to delete driver.');
          return;
        }
        loadDrivers();
      });

      driverTable.appendChild(row);
    });
  }

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    addError.classList.add('hidden');

    const code = document.getElementById('newCode').value.trim();
    const displayName = document.getElementById('newDisplayName').value.trim();
    const pin = document.getElementById('newPin').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const vehicleId = document.getElementById('newVehicleId').value.trim();

    const res = await fetch('/api/drivers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, displayName, pin, phone, vehicleId }),
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      addError.textContent = body.error || 'Failed to add driver.';
      addError.classList.remove('hidden');
      return;
    }

    addForm.reset();
    loadDrivers();
  });

  async function init() {
    const res = await fetch('/api/me');
    if (!res.ok) {
      window.location.href = '/login';
      return;
    }
    const user = await res.json();
    if (user.role !== 'dispatcher') {
      window.location.href = '/login';
      return;
    }
    loadDrivers();
  }

  init();
})();
</script>
</body>
</html>
