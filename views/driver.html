<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Driver — OSDispatch</title>
<link rel="icon" href="data:," />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#4f6bff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OSDispatch" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { display: flex; justify-content: center; padding: 20px 16px 40px; }
  .page { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }

  .topbar-mini { display: flex; align-items: center; justify-content: space-between; }

  .greeting h1 { margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .greeting p { margin: 0; font-size: 14px; color: var(--text-mid); }

  .status-card { padding: 20px; text-align: center; transition: background-color .2s ease, border-color .2s ease; }
  .status-label { margin-bottom: 8px; }
  .status-headline { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .status-meta { font-family: var(--font-mono); font-size: 13px; margin-top: 6px; min-height: 18px; }
  .status-card.status-off { background: var(--subtle); border-color: var(--border); }
  .status-card.status-off .status-headline { color: var(--text-mid); }
  .status-card.status-off .status-meta { color: var(--text-low); }
  .status-card.status-on { background: var(--active-bg); border-color: var(--active-border); }
  .status-card.status-on .status-label,
  .status-card.status-on .status-headline { color: var(--active-text); }
  .status-card.status-on .status-meta { color: var(--active); }

  .fix-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .fix-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-low); display: inline-block; }
  .fix-card.is-live .fix-dot { background: var(--active); }
  .fix-value { font-size: 15px; font-weight: 500; }
  .fix-detail { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-mid); }
  .fix-detail.hidden { display: none; }

  .error-banner {
    background: var(--disconnected-bg); border: 1px solid var(--disconnected-border); color: var(--disconnected-text);
    font-size: 13px; border-radius: 10px; padding: 10px 12px;
  }
  .error-banner.hidden { display: none; }

  .shift-btn {
    width: 100%; height: 96px; border-radius: 22px; font-family: var(--font-sans);
    font-size: 24px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .shift-btn-start { border: none; background: var(--active); color: #fff; box-shadow: 0 14px 30px rgba(18, 183, 106, 0.35); }
  .shift-btn-end { border: 2px solid var(--disconnected); background: #fff; color: var(--disconnected-text); }
  .shift-icon { width: 15px; height: 15px; border-radius: 50%; background: currentColor; }
  .shift-btn-end .shift-icon { border-radius: 4px; background: var(--disconnected); }
  .shift-btn-start .shift-icon { background: #fff; }
  .shift-caption { text-align: center; font-size: 13px; color: var(--text-low); margin: 14px 0 0; }

  .install-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .install-card.hidden { display: none; }
  .install-row { display: flex; align-items: center; gap: 12px; }
  .install-row .brand-mark { width: 42px; height: 42px; border-radius: 11px; }
  .install-row .brand-mark::after { width: 14px; height: 14px; }
  .install-title { font-size: 15px; font-weight: 700; margin: 0; }
  .install-desc { font-size: 13px; color: var(--text-mid); margin: 2px 0 0; line-height: 1.4; }
  .install-actions { display: flex; gap: 10px; }
  .install-actions .btn-primary { flex: 1; }
</style>
</head>
<body>

  <div class="page">
    <div class="topbar-mini">
      <div class="brand"><div class="brand-mark"></div><span class="brand-name">OSDispatch</span></div>
      <button id="logoutBtn" class="btn-link">Log out</button>
    </div>

    <div class="greeting">
      <p>Hi, <span id="driverName">…</span></p>
      <h1 id="greetingHeadline">Ready to start?</h1>
    </div>

    <div id="statusCard" class="card status-card status-off">
      <div class="label-mono status-label">CURRENT STATUS</div>
      <div id="statusBadge" class="status-headline">OFF SHIFT</div>
      <div id="shiftMeta" class="status-meta"></div>
    </div>

    <div id="fixCard" class="card fix-card">
      <div class="label-mono" style="display:flex;align-items:center;gap:7px;"><span class="fix-dot"></span>LAST GPS FIX</div>
      <div id="lastFix" class="fix-value mono">—</div>
      <div id="gpsDetail" class="fix-detail hidden">
        <span id="gpsCoords"></span>
        <span id="gpsAccuracy"></span>
      </div>
      <div id="updateCount" class="mono" style="font-size:12px;color:var(--text-low);">Updates sent: 0</div>
    </div>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div>
      <button id="shiftToggle" class="shift-btn shift-btn-start">
        <span class="shift-icon"></span>Start shift
      </button>
      <p id="shiftCaption" class="shift-caption">Location sharing turns on when you start</p>
    </div>

    <div id="installBanner" class="card install-card hidden">
      <div class="install-row">
        <div class="brand-mark"></div>
        <div>
          <p class="install-title">Install OSDispatch</p>
          <p id="installText" class="install-desc">Installing this page as an app makes it less likely to get closed by accident during a shift.</p>
        </div>
      </div>
      <div class="install-actions">
        <button id="installBtn" class="btn btn-primary hidden">Install app</button>
        <button id="dismissInstallBtn" class="btn btn-secondary">Dismiss</button>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  const EMIT_INTERVAL_MS = 7000;
  const META_TICK_MS = 15000;

  const shiftToggle = document.getElementById('shiftToggle');
  const statusCard = document.getElementById('statusCard');
  const statusBadge = document.getElementById('statusBadge');
  const shiftMeta = document.getElementById('shiftMeta');
  const greetingHeadline = document.getElementById('greetingHeadline');
  const shiftCaption = document.getElementById('shiftCaption');
  const driverNameEl = document.getElementById('driverName');
  const logoutBtn = document.getElementById('logoutBtn');
  const errorBanner = document.getElementById('errorBanner');
  const fixCard = document.getElementById('fixCard');
  const lastFixEl = document.getElementById('lastFix');
  const gpsDetail = document.getElementById('gpsDetail');
  const gpsCoords = document.getElementById('gpsCoords');
  const gpsAccuracy = document.getElementById('gpsAccuracy');
  const updateCountEl = document.getElementById('updateCount');
  const installBanner = document.getElementById('installBanner');
  const installText = document.getElementById('installText');
  const installBtn = document.getElementById('installBtn');
  const dismissInstallBtn = document.getElementById('dismissInstallBtn');

  let socket = null;
  let onShift = false;
  let watchId = null;
  let emitTimer = null;
  let metaTimer = null;
  let latestPosition = null;
  let wakeLock = null;
  let updateCount = 0;
  let shiftStartedAt = null;

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.remove('hidden');
  }

  function clearError() {
    errorBanner.classList.add('hidden');
    errorBanner.textContent = '';
  }

  function setStatus(text, variant) {
    statusBadge.textContent = text;
    statusCard.className = 'card status-card status-' + variant;
  }

  function formatElapsed(ms) {
    const totalMin = Math.max(0, Math.floor(ms / 60000));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function renderShiftMeta() {
    if (!onShift || !shiftStartedAt) {
      shiftMeta.textContent = '';
      return;
    }
    const started = new Date(shiftStartedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    shiftMeta.textContent = `Shift ${formatElapsed(Date.now() - shiftStartedAt)} · started ${started}`;
  }

  function renderGpsDetail() {
    if (!latestPosition) return;
    const ageSec = Math.max(0, Math.round((Date.now() - latestPosition.timestamp) / 1000));
    const { latitude, longitude, accuracy } = latestPosition.coords;
    gpsCoords.textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
    gpsAccuracy.textContent = typeof accuracy === 'number' ? `±${Math.round(accuracy)} m accuracy` : '';
    lastFixEl.textContent = `${ageSec}s ago`;
    gpsDetail.classList.remove('hidden');
  }

  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
      // Not fatal — the on-screen reminder covers this case.
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (onShift && document.visibilityState === 'visible') {
      acquireWakeLock();
    }
  });

  function geolocationErrorMessage(err) {
    switch (err.code) {
      case err.PERMISSION_DENIED:
        return 'Location permission denied. Enable location access for this site in your browser settings to start your shift.';
      case err.POSITION_UNAVAILABLE:
        return 'Location is currently unavailable. Move to an area with better GPS/network signal.';
      case err.TIMEOUT:
        return 'Timed out getting your location. Retrying automatically.';
      default:
        return 'Unable to get your location.';
    }
  }

  function emitLocation() {
    if (!latestPosition || !socket) return;

    // A GPS fix delivered while the tab was backgrounded/suspended can sit in
    // latestPosition long after it was captured. Sending it stamped with the
    // current time pairs a stale position with a fresh timestamp — over a
    // short interval that reads as an impossible speed and draws a straight
    // line to wherever the driver actually is now. Wait for a fresh fix
    // instead of bridging the gap with a bad guess.
    const fixAgeMs = Date.now() - latestPosition.timestamp;
    if (fixAgeMs > EMIT_INTERVAL_MS * 1.5) return;

    const { latitude, longitude, speed } = latestPosition.coords;
    // driverId/name are not sent — the server derives identity from the
    // authenticated session so a client can never spoof another driver.
    socket.emit('location_update', {
      latitude,
      longitude,
      timestamp: Date.now(),
      // coords.speed (m/s) is the device's own GPS-derived speed when
      // available — more reliable than deriving it from position deltas.
      speed: typeof speed === 'number' ? speed : null,
    });
    updateCount += 1;
    updateCountEl.textContent = 'Updates sent: ' + updateCount;
  }

  function startShift() {
    if (!('geolocation' in navigator)) {
      showError('This browser does not support location tracking.');
      return;
    }

    clearError();
    onShift = true;
    shiftStartedAt = Date.now();
    setStatus('ON SHIFT', 'on');
    greetingHeadline.textContent = 'On the road';
    fixCard.classList.add('is-live');
    shiftToggle.className = 'shift-btn shift-btn-end';
    shiftToggle.innerHTML = '<span class="shift-icon"></span>End shift';
    shiftCaption.textContent = 'Location stops sharing when you end';
    renderShiftMeta();

    acquireWakeLock();

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        clearError();
        latestPosition = pos;
        renderGpsDetail();
      },
      (err) => {
        showError(geolocationErrorMessage(err));
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );

    emitTimer = setInterval(emitLocation, EMIT_INTERVAL_MS);
    metaTimer = setInterval(() => {
      renderShiftMeta();
      renderGpsDetail();
    }, META_TICK_MS);
  }

  function endShift() {
    onShift = false;
    shiftStartedAt = null;
    setStatus('OFF SHIFT', 'off');
    greetingHeadline.textContent = 'Ready to start?';
    fixCard.classList.remove('is-live');
    shiftToggle.className = 'shift-btn shift-btn-start';
    shiftToggle.innerHTML = '<span class="shift-icon"></span>Start shift';
    shiftCaption.textContent = 'Location sharing turns on when you start';
    renderShiftMeta();

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (emitTimer !== null) {
      clearInterval(emitTimer);
      emitTimer = null;
    }
    if (metaTimer !== null) {
      clearInterval(metaTimer);
      metaTimer = null;
    }
    releaseWakeLock();

    if (socket) socket.emit('end_shift');
  }

  shiftToggle.addEventListener('click', () => {
    if (onShift) {
      endShift();
    } else {
      startShift();
    }
  });

  logoutBtn.addEventListener('click', async () => {
    if (onShift) endShift();
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  // Registered only so the browser considers this page installable — see
  // views/sw.js for why the service worker itself does nothing else.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/driver' }).catch(() => {});
  }

  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem('installBannerDismissed') === '1';

  let deferredInstallPrompt = null;

  if (!isStandalone && !dismissed) {
    if (isIos) {
      // iOS has no programmatic install prompt — Safari only supports this
      // through the manual Share sheet, so just show the steps.
      installText.textContent =
        'Tap the Share icon in Safari, then "Add to Home Screen". Launching from the home screen icon is less likely to get closed by accident during a shift.';
      installBanner.classList.remove('hidden');
    } else {
      // Android/Chrome: wait for the browser to confirm this is installable,
      // then show our own button that triggers its native prompt.
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installBanner.classList.remove('hidden');
        installBtn.classList.remove('hidden');
      });
    }
  }

  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBanner.classList.add('hidden');
  });

  dismissInstallBtn.addEventListener('click', () => {
    localStorage.setItem('installBannerDismissed', '1');
    installBanner.classList.add('hidden');
  });

  async function init() {
    const res = await fetch('/api/me');
    if (!res.ok) {
      window.location.href = '/login';
      return;
    }
    const user = await res.json();
    if (user.role !== 'driver') {
      window.location.href = '/login';
      return;
    }
    driverNameEl.textContent = user.displayName;
    socket = io();

    // The account session survives a refresh on its own (it's just a cookie),
    // but this page's local state (onShift, the watch/timer handles) doesn't.
    // If the server still considers this driver's shift active, resume
    // tracking automatically instead of resetting to "Start Shift" — from
    // the driver's side, that reset looked indistinguishable from being
    // signed out even though the account itself was never logged out.
    if (user.shiftActive) {
      startShift();
    }
  }

  init();
})();
</script>
</body>
</html>
