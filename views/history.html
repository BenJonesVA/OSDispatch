<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History — OSDispatch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  html, body { height: 100%; }
  #app-root { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .body-area { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
  .map-wrapper { flex: 1 1 auto; position: relative; overflow: hidden; background: var(--sunken); min-height: 0; }
  #map { width: 100%; height: 100%; }

  .filter-bar { display: flex; align-items: end; gap: 12px; padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filter-field { display: flex; flex-direction: column; gap: 6px; }
  .filter-field label { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); letter-spacing: 0.05em; }
  .filter-field select, .filter-field input { height: 38px; }
  .filter-field.time-field input { width: 110px; }
  .filter-field.drive-field { min-width: 220px; }
  .filter-field.drive-field.hidden { display: none; }

  .stat-bar { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--border); background: var(--card); }
  .stat-bar.hidden { display: none; }
  .stat-cell { padding: 16px 20px; border-right: 1px solid var(--subtle); }
  .stat-cell:last-child { border-right: none; background: var(--speeding-bg); }
  .stat-cell .label-mono { margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-value .unit { font-size: 14px; color: var(--text-low); font-weight: 500; }
  .stat-cell.stat-warn .label-mono, .stat-cell.stat-warn .stat-value { color: var(--speeding-text); }

  .body-split { flex: 1 1 auto; display: flex; overflow: hidden; min-height: 0; }
  .events-panel { width: 320px; flex: none; border-left: 1px solid var(--border); background: var(--card); padding: 18px; overflow-y: auto; }
  .events-panel.hidden { display: none; }
  .events-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .events-heading h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .events-count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--speeding-text); background: var(--speeding-bg); padding: 2px 9px; border-radius: 999px; font-weight: 500; }
  .event-card { border: 1px solid var(--speeding-border); background: #fffaf0; border-left: 3px solid var(--speeding); border-radius: 10px; padding: 12px 13px; margin-bottom: 10px; cursor: pointer; }
  .event-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .event-speed { font-size: 14px; font-weight: 700; color: var(--speeding-text); }
  .event-speed .limit { font-size: 11px; font-weight: 500; color: var(--text-low); }
  .event-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
  .event-loc { font-size: 12px; color: var(--text-mid); }

  #statusMessage { font-size: 13px; color: var(--text-mid); padding: 10px 20px; }
  #statusMessage.hidden { display: none; }

  .playback-bar {
    position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 500;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; box-shadow: var(--shadow-hover); display: flex; align-items: center; gap: 14px;
  }
  .playback-bar.hidden { display: none; }
  .playback-btn { width: 36px; height: 36px; border: none; border-radius: 9px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; flex: none; display: flex; align-items: center; justify-content: center; }
  .playback-track { flex: 1; position: relative; height: 16px; display: flex; align-items: center; }
  .playback-track input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  .playback-ticks { position: absolute; left: 0; right: 0; top: 1px; height: 14px; pointer-events: none; }
  .playback-tick { position: absolute; top: 0; width: 4px; height: 14px; border-radius: 2px; background: var(--speeding); }
  .playback-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-mid); flex: none; white-space: nowrap; }
</style>
</head>
<body>

<div id="app-root">
  <header class="topbar" style="flex:none;">
    <div class="brand"><div class="brand-mark"></div><span class="brand-name">OSDispatch</span></div>
    <h1 style="font-size:16px;font-weight:700;margin:0 0 0 12px;">Trip History</h1>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px;">
      <a href="/dispatch" class="btn-link">Back to Dashboard</a>
      <button id="logoutBtn" class="btn-link">Log out</button>
    </div>
  </header>

  <div class="body-area">
    <form id="filterForm" class="filter-bar">
      <div class="filter-field">
        <label>DRIVER</label>
        <select id="driverSelect" required class="input"></select>
      </div>
      <div class="filter-field">
        <label>FROM</label>
        <input id="fromDate" type="date" required class="input" />
      </div>
      <div class="filter-field time-field">
        <label>FROM TIME</label>
        <input id="fromTime" type="time" required class="input input-mono" value="00:00" />
      </div>
      <div class="filter-field">
        <label>TO</label>
        <input id="toDate" type="date" required class="input" />
      </div>
      <div class="filter-field time-field">
        <label>TO TIME</label>
        <input id="toTime" type="time" required class="input input-mono" value="23:59" />
      </div>
      <button type="submit" class="btn btn-primary">Apply</button>

      <div class="filter-field drive-field hidden" id="driveField">
        <label>DRIVE</label>
        <select id="driveSelect" class="input"></select>
      </div>
    </form>

    <div id="statTable" class="stat-bar hidden">
      <div class="stat-cell"><div class="label-mono">DISTANCE</div><div class="stat-value"><span id="summaryDistance"></span></div></div>
      <div class="stat-cell"><div class="label-mono">DURATION</div><div class="stat-value" id="summaryDuration"></div></div>
      <div class="stat-cell"><div class="label-mono">AVG SPEED</div><div class="stat-value"><span id="summaryAvgSpeed"></span></div></div>
      <div class="stat-cell"><div class="label-mono">MAX SPEED</div><div class="stat-value"><span id="summaryMaxSpeed"></span></div></div>
      <div class="stat-cell stat-warn"><div class="label-mono">SPEEDING EVENTS</div><div class="stat-value" id="summarySpeeding"></div></div>
    </div>

    <div id="statusMessage" class="hidden"></div>

    <div class="body-split">
      <div class="map-wrapper">
        <div id="map"></div>
        <div id="playbackBar" class="playback-bar hidden">
          <button type="button" id="playPauseBtn" class="playback-btn">▶</button>
          <div class="playback-track">
            <input type="range" id="scrubber" min="0" max="1000" value="0" />
            <div id="playbackTicks" class="playback-ticks"></div>
          </div>
          <span class="playback-time"><span id="currentTimeLabel">—</span> / <span id="totalTimeLabel">—</span></span>
        </div>
      </div>
      <div id="eventsPanel" class="events-panel hidden">
        <div class="events-heading">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--speeding);"></span>
          <h3>Speeding events</h3>
          <span id="eventsCount" class="events-count"></span>
        </div>
        <div id="eventsList"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19,
  }).addTo(map);

  let units = 'metric';
  function formatDistance(km) {
    if (units === 'imperial') return (km * 0.621371).toFixed(2) + ' mi';
    return km.toFixed(2) + ' km';
  }
  function formatSpeed(kmh) {
    if (kmh === null || kmh === undefined) return 'n/a';
    if (units === 'imperial') return (kmh * 0.621371).toFixed(1) + ' mph';
    return kmh.toFixed(1) + ' km/h';
  }
  function formatDuration(ms) {
    const totalMin = Math.max(0, Math.round(ms / 60000));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }
  function formatTimeShort(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Great-circle distance in km — mirrors the server's haversineDistanceKm
  // (server.js) so client-computed per-drive stats match the server's.
  function haversineKm(a, b) {
    const R = 6371;
    const toRad = (deg) => (deg * Math.PI) / 180;
    const dLat = toRad(b.latitude - a.latitude);
    const dLon = toRad(b.longitude - a.longitude);
    const lat1 = toRad(a.latitude);
    const lat2 = toRad(b.latitude);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  // Matches the server's HISTORY_GAP_MS: a gap this long means the
  // connection dropped for a real stretch, not just a missed ping — it's
  // also what separates one "drive" from the next within a day.
  const HISTORY_GAP_MS = 90_000;
  // Small buffer above the posted limit before a point is flagged, so
  // ordinary GPS/sensor noise around the limit doesn't read as speeding.
  const SPEEDING_MARGIN_KMH = 8;
  // Wall-clock length of one full replay, regardless of how long the real
  // drive took — keeps playback watchable for both a 10-minute and 4-hour drive.
  const PLAYBACK_DURATION_MS = 20_000;

  function splitIntoSegments(points) {
    const segments = [];
    let current = [];
    for (let i = 0; i < points.length; i++) {
      if (i > 0 && new Date(points[i].recordedAt) - new Date(points[i - 1].recordedAt) > HISTORY_GAP_MS) {
        segments.push(current);
        current = [];
      }
      current.push(points[i]);
    }
    if (current.length) segments.push(current);
    return segments;
  }

  function speedingPoints(points) {
    return points.filter((p) => typeof p.speedKmh === 'number' && typeof p.speedLimitKmh === 'number'
      && p.speedKmh > p.speedLimitKmh + SPEEDING_MARGIN_KMH);
  }

  // Distance/duration/speed stats recomputed client-side from raw points so
  // the exact same logic works whether "points" is the whole fetched range
  // (possibly spanning several drives) or a single selected drive.
  function computeStats(points) {
    const segments = splitIntoSegments(points);
    let distanceKm = 0;
    let durationMs = 0;
    segments.forEach((seg) => {
      for (let i = 1; i < seg.length; i++) distanceKm += haversineKm(seg[i - 1], seg[i]);
      if (seg.length >= 2) durationMs += new Date(seg[seg.length - 1].recordedAt) - new Date(seg[0].recordedAt);
    });
    const knownSpeeds = points.map((p) => p.speedKmh).filter((s) => typeof s === 'number');
    return {
      distanceKm,
      durationMs,
      avgSpeedKmh: knownSpeeds.length ? knownSpeeds.reduce((a, b) => a + b, 0) / knownSpeeds.length : null,
      maxSpeedKmh: knownSpeeds.length ? Math.max(...knownSpeeds) : null,
      speedingCount: speedingPoints(points).length,
      pointCount: points.length,
    };
  }

  let routeLayers = [];
  let speedMarkers = [];

  function clearRoute() {
    routeLayers.forEach((layer) => map.removeLayer(layer));
    routeLayers = [];
    speedMarkers.forEach((marker) => map.removeLayer(marker));
    speedMarkers = [];
  }

  function renderRoute(points) {
    clearRoute();
    if (points.length < 2) return;

    const segments = splitIntoSegments(points);
    const bounds = [];
    segments.forEach((segment) => {
      if (segment.length < 2) return;
      const latlngs = segment.map((p) => [p.latitude, p.longitude]);
      routeLayers.push(L.polyline(latlngs, { color: '#ffffff', weight: 7, opacity: 0.7 }).addTo(map));
      routeLayers.push(L.polyline(latlngs, { color: '#4f6bff', weight: 4, opacity: 0.9 }).addTo(map));
      bounds.push(...latlngs);
    });

    speedingPoints(points).forEach((p) => {
      const marker = L.circleMarker([p.latitude, p.longitude], {
        radius: 6, color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: 0.8,
      }).addTo(map);
      marker.bindPopup(
        `<div style="font-size:13px;">
          <div>${formatSpeed(p.speedKmh)} in a ${formatSpeed(p.speedLimitKmh)} zone</div>
          <div style="color:#5a6478;">${new Date(p.recordedAt).toLocaleString()}</div>
        </div>`
      );
      speedMarkers.push(marker);
    });

    if (bounds.length) map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40] });
  }

  function renderEventsList(points) {
    const events = speedingPoints(points);
    const eventsPanel = document.getElementById('eventsPanel');
    const eventsList = document.getElementById('eventsList');
    const eventsCount = document.getElementById('eventsCount');

    eventsPanel.classList.toggle('hidden', events.length === 0);
    eventsCount.textContent = events.length;
    eventsList.innerHTML = events.map((p, i) => `
      <div class="event-card" data-index="${i}">
        <div class="event-top">
          <span class="event-speed">${formatSpeed(p.speedKmh)} <span class="limit">/ ${formatSpeed(p.speedLimitKmh)}</span></span>
          <span class="event-time">${new Date(p.recordedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        </div>
        <div class="event-loc">${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}</div>
      </div>
    `).join('');
    Array.from(eventsList.children).forEach((card, i) => {
      card.addEventListener('click', () => map.panTo([events[i].latitude, events[i].longitude]));
    });
  }

  // --- Replay / playback -----------------------------------------------

  let playbackPoints = [];
  let playbackMarker = null;
  let playbackFraction = 0;
  let playing = false;
  let playbackStartWallClock = 0;
  let playbackStartFraction = 0;
  let rafId = null;

  const playbackBar = document.getElementById('playbackBar');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const scrubber = document.getElementById('scrubber');
  const playbackTicks = document.getElementById('playbackTicks');
  const currentTimeLabel = document.getElementById('currentTimeLabel');
  const totalTimeLabel = document.getElementById('totalTimeLabel');

  function playbackIcon() {
    return L.divIcon({
      className: '', iconSize: [18, 18], iconAnchor: [9, 9],
      html: '<div style="width:16px;height:16px;border-radius:50%;background:#4f6bff;border:3px solid #fff;box-shadow:0 2px 6px rgba(26,33,48,.35);"></div>',
    });
  }

  function interpolatePosition(points, fraction) {
    const t0 = new Date(points[0].recordedAt).getTime();
    const t1 = new Date(points[points.length - 1].recordedAt).getTime();
    const targetT = t0 + fraction * (t1 - t0);
    let i = 1;
    while (i < points.length - 1 && new Date(points[i].recordedAt).getTime() < targetT) i++;
    const a = points[i - 1];
    const b = points[i];
    const ta = new Date(a.recordedAt).getTime();
    const tb = new Date(b.recordedAt).getTime();
    const segFrac = tb > ta ? Math.max(0, Math.min(1, (targetT - ta) / (tb - ta))) : 0;
    return {
      lat: a.latitude + (b.latitude - a.latitude) * segFrac,
      lng: a.longitude + (b.longitude - a.longitude) * segFrac,
      time: targetT,
    };
  }

  function pausePlayback() {
    playing = false;
    playPauseBtn.textContent = '▶';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function setPlaybackFraction(f) {
    playbackFraction = Math.max(0, Math.min(1, f));
    scrubber.value = String(Math.round(playbackFraction * 1000));
    if (!playbackPoints.length) return;
    const pos = interpolatePosition(playbackPoints, playbackFraction);
    if (playbackMarker) playbackMarker.setLatLng([pos.lat, pos.lng]);
    currentTimeLabel.textContent = formatTimeShort(pos.time);
  }

  function playbackTick(now) {
    if (!playing) return;
    const elapsed = now - playbackStartWallClock;
    let f = playbackStartFraction + elapsed / PLAYBACK_DURATION_MS;
    if (f >= 1) {
      setPlaybackFraction(1);
      pausePlayback();
      return;
    }
    setPlaybackFraction(f);
    rafId = requestAnimationFrame(playbackTick);
  }

  function startPlayback() {
    if (!playbackPoints.length) return;
    if (playbackFraction >= 1) playbackFraction = 0;
    playing = true;
    playPauseBtn.textContent = '⏸';
    playbackStartWallClock = performance.now();
    playbackStartFraction = playbackFraction;
    rafId = requestAnimationFrame(playbackTick);
  }

  playPauseBtn.addEventListener('click', () => {
    if (playing) pausePlayback();
    else startPlayback();
  });

  scrubber.addEventListener('input', () => {
    pausePlayback();
    setPlaybackFraction(Number(scrubber.value) / 1000);
  });

  function setupPlayback(points) {
    pausePlayback();
    if (playbackMarker) { map.removeLayer(playbackMarker); playbackMarker = null; }
    playbackTicks.innerHTML = '';

    if (points.length < 2) {
      playbackBar.classList.add('hidden');
      playbackPoints = [];
      return;
    }

    playbackBar.classList.remove('hidden');
    playbackPoints = points;
    playbackFraction = 0;

    const t0 = new Date(points[0].recordedAt).getTime();
    const t1 = new Date(points[points.length - 1].recordedAt).getTime();
    totalTimeLabel.textContent = formatTimeShort(t1);

    speedingPoints(points).forEach((p) => {
      const frac = t1 > t0 ? (new Date(p.recordedAt).getTime() - t0) / (t1 - t0) : 0;
      const tick = document.createElement('div');
      tick.className = 'playback-tick';
      tick.style.left = `calc(${(frac * 100).toFixed(2)}% - 2px)`;
      playbackTicks.appendChild(tick);
    });

    playbackMarker = L.marker([points[0].latitude, points[0].longitude], { icon: playbackIcon() }).addTo(map);
    setPlaybackFraction(0);
  }

  // --- Drive detection ---------------------------------------------------
  // A "drive" is a contiguous run of pings with no gap bigger than
  // HISTORY_GAP_MS — the same boundary already used to break the route and
  // exclude cross-gap distance. A dispatcher can then look at one drive out
  // of several the same driver made in a day, instead of only whole-day
  // aggregates.

  let currentPoints = [];
  let drives = [];
  let activeDriveIndex = 'all';

  const driveField = document.getElementById('driveField');
  const driveSelect = document.getElementById('driveSelect');

  function getActivePoints() {
    return activeDriveIndex === 'all' ? currentPoints : drives[activeDriveIndex];
  }

  function activeIsSingleDrive() {
    return activeDriveIndex !== 'all' || drives.length <= 1;
  }

  function renderActive() {
    const points = getActivePoints();
    const stats = computeStats(points);

    document.getElementById('summaryDistance').textContent = formatDistance(stats.distanceKm);
    document.getElementById('summaryDuration').textContent = formatDuration(stats.durationMs);
    document.getElementById('summaryAvgSpeed').textContent = formatSpeed(stats.avgSpeedKmh);
    document.getElementById('summaryMaxSpeed').textContent = formatSpeed(stats.maxSpeedKmh);
    document.getElementById('summarySpeeding').textContent = stats.speedingCount;
    document.getElementById('statTable').classList.remove('hidden');

    renderRoute(points);
    renderEventsList(points);
    setupPlayback(activeIsSingleDrive() ? points : []);
  }

  function populateDriveSelect() {
    drives = splitIntoSegments(currentPoints).filter((seg) => seg.length > 0);
    activeDriveIndex = 'all';

    if (drives.length <= 1) {
      driveField.classList.add('hidden');
      driveSelect.innerHTML = '';
      return;
    }

    driveField.classList.remove('hidden');
    const options = [`<option value="all">All (${drives.length} drives)</option>`];
    drives.forEach((drive, i) => {
      const start = formatTimeShort(new Date(drive[0].recordedAt).getTime());
      const end = formatTimeShort(new Date(drive[drive.length - 1].recordedAt).getTime());
      const stats = computeStats(drive);
      options.push(`<option value="${i}">Drive ${i + 1} · ${start}–${end} (${formatDistance(stats.distanceKm)})</option>`);
    });
    driveSelect.innerHTML = options.join('');
  }

  driveSelect.addEventListener('change', () => {
    activeDriveIndex = driveSelect.value === 'all' ? 'all' : Number(driveSelect.value);
    renderActive();
  });

  function showStatus(message) {
    const el = document.getElementById('statusMessage');
    el.textContent = message;
    el.classList.toggle('hidden', !message);
  }

  const filterForm = document.getElementById('filterForm');
  const driverSelect = document.getElementById('driverSelect');
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');
  const fromTime = document.getElementById('fromTime');
  const toTime = document.getElementById('toTime');
  const statTable = document.getElementById('statTable');

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  async function loadDrivers() {
    const res = await fetch('/api/drivers');
    const driversList = await res.json();
    driverSelect.innerHTML = driversList
      .map((d) => `<option value="${d.id}">${escapeHtml(d.displayName)} (${escapeHtml(d.code)})</option>`)
      .join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  filterForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    statTable.classList.add('hidden');
    document.getElementById('eventsPanel').classList.add('hidden');
    driveField.classList.add('hidden');
    setupPlayback([]);
    showStatus('Loading…');
    clearRoute();

    const driverId = driverSelect.value;
    const from = `${fromDate.value}T${fromTime.value}:00`;
    const to = `${toDate.value}T${toTime.value}:59.999`;

    const res = await fetch(`/api/history?driverId=${encodeURIComponent(driverId)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showStatus(body.error || 'Failed to load history.');
      return;
    }

    const data = await res.json();
    if (!data.points.length) {
      showStatus(`No location data for ${data.driver.displayName} in that range.`);
      return;
    }

    showStatus('');
    currentPoints = data.points;
    populateDriveSelect();
    renderActive();
  });

  async function init() {
    const meRes = await fetch('/api/me');
    if (!meRes.ok) {
      window.location.href = '/login';
      return;
    }
    const user = await meRes.json();
    if (user.role !== 'dispatcher') {
      window.location.href = '/login';
      return;
    }

    const configRes = await fetch('/api/config');
    if (configRes.ok) {
      const config = await configRes.json();
      units = config.units === 'imperial' ? 'imperial' : 'metric';
    }

    const today = new Date().toISOString().slice(0, 10);
    fromDate.value = today;
    toDate.value = today;

    await loadDrivers();
  }

  init();
})();
</script>
</body>
</html>
