# When Nginx Proxy Manager (or another TLS-terminating proxy) sits in front
# of this nginx, it forwards the original scheme via X-Forwarded-Proto — pass
# that through unchanged rather than overwriting it with $scheme, which would
# only ever reflect this hop (plain http between NPM and this container) and
# would make the app think every request is insecure. Falls back to $scheme
# for direct access (e.g. local testing without NPM in front).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Required for Socket.io's WebSocket upgrade to pass through the proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
